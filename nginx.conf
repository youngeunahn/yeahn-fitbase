server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 모든 요청을 index.html로 보내서 Next.js의 클라이언트 라우팅이 동작하게 함
        try_files $uri $uri/ /index.html;
    }

    # API 요청은 백엔드로 프록시
    location /api/ {
        proxy_pass http://springbootyeahn:8080;
    }

    # 로그인 POST 요청은 백엔드로 프록시하고, GET /login은 정적 페이지로 처리
    location = /login {
        if ($request_method = POST) {
            return 418;
        }

        try_files /login.html /index.html;
    }

    error_page 418 = @backend_login;

    location @backend_login {
        proxy_pass http://springbootyeahn:8080;
    }

    location /exercise/ {
        proxy_pass http://springbootyeahn:8080;
    }
}
